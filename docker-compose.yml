version: '3.8'

services:
  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "50051:50051"
    depends_on:
      - payment-service
      - inventory-service

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    ports:
      - "50052:50052"

  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service
    ports:
      - "50053:50053"