syntax = "proto3";

package order;
option go_package = "./orderpb";

service OrderService {
  rpc CreateOrder (OrderRequest) returns (OrderResponse);
}

message OrderRequest {
  string item_id = 1;
  int32 quantity = 2;
  string user_id = 3;
}

message OrderResponse {
  string order_id = 1;
  string status = 2;
}