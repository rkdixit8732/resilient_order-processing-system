syntax = "proto3";

package inventory;
option go_package = "./inventorypb";

service InventoryService {
  rpc ReserveItem (InventoryRequest) returns (InventoryResponse);
  rpc ReleaseItem (InventoryRequest) returns (InventoryResponse);
}

message InventoryRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message InventoryResponse {
  bool success = 1;
  string message = 2;
}