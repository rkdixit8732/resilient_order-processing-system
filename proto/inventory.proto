syntax = "proto3";

package inventory;

option go_package = "proto/inventory";

service InventoryService {
  rpc ReserveItem (InventoryRequest) returns (InventoryResponse);
}

message InventoryRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message InventoryResponse {
  string status = 1;
  string message = 2;
}